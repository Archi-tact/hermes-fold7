# Hermes Hands — 화면 조작 동반 앱: APK 빌드 + 가상 안드로이드에서 종단 테스트(녹화)
#   폰 설치: Releases → hands-latest → hermes-hands.apk
name: hands
on:
  workflow_dispatch:
  push:
    paths: ["android/**", "bridge/**", "skills/fold7-hands/**", "lab/redroid/**", ".github/workflows/hands.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write     # 처음 한 번: 암호화된 서명 키 저장
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: 서명 키 준비 (Secrets 의 HANDS_SIGNING_PASS 로 암호화된 키 사용 · 없으면 처음 한 번 생성)
        env:
          PASS: ${{ secrets.HANDS_SIGNING_PASS }}
        run: |
          ENC=android/hands/signing/hands.jks.enc
          if [ -z "$PASS" ]; then echo "::warning::HANDS_SIGNING_PASS 없음 → 임시 키 서명 (업데이트 시 기존 앱 삭제 필요)"; exit 0; fi
          [ ${#PASS} -ge 20 ] || { echo "::error::HANDS_SIGNING_PASS 는 20자 이상이어야 합니다"; exit 1; }
          if [ ! -f "$ENC" ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "main 에서만 키 생성"; exit 0; }
            keytool -genkeypair -keystore "$RUNNER_TEMP/hands.jks" -storetype PKCS12 -alias hands -keyalg RSA -keysize 3072 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Hermes Hands, O=hermes-fold7" >/dev/null
            mkdir -p "$(dirname "$ENC")"
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$RUNNER_TEMP/hands.jks" -out "$ENC" -pass env:PASS
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ENC"; git commit -m "Add encrypted Hermes Hands signing key [skip ci]" && git push origin HEAD:main
            echo "새 서명 키 생성 (암호화 저장)"
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$ENC" -out "$RUNNER_TEMP/hands.jks" -pass env:PASS
          echo "HANDS_KEYSTORE=$RUNNER_TEMP/hands.jks" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$RUNNER_TEMP/hands.jks" -storepass "$PASS" | grep -m1 'SHA256:' | sed 's/^\s*/서명 지문 /'
      - name: APK 빌드
        env:
          HANDS_KEYSTORE_PASSWORD: ${{ secrets.HANDS_SIGNING_PASS }}
        run: gradle -p android/hands --no-daemon assembleRelease
      - name: 결과 정리
        run: |
          cp android/hands/app/build/outputs/apk/release/app-release.apk hermes-hands.apk
          sha256sum hermes-hands.apk | tee hermes-hands.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-hands-apk
          path: |
            hermes-hands.apk
            hermes-hands.apk.sha256

  e2e:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write      # 결과 GIF 게시(hands-results 브랜치) + APK 릴리스(hands-latest)
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: hermes-hands-apk }
      - name: 안드로이드(redroid) 기동
        run: sudo -E LAB_CI=1 REDROID_VERSION=14.0.0_64only REDROID_FALLBACKS="13.0.0_64only" REDROID_W=1080 REDROID_H=1920 REDROID_DPI=420 bash lab/redroid/setup-server.sh
      - name: Termux + 폰 브리지 설치 (Hermes 본체 없이)
        run: sudo -E PLAN=none bash lab/redroid/install-termux.sh
      - name: Hermes Hands 종단 테스트 (녹화)
        timeout-minutes: 25
        shell: bash
        run: |
          mkdir -p lab/redroid/artifacts
          sudo -E bash lab/redroid/hands-e2e.sh "$PWD/hermes-hands.apk" | tee lab/redroid/artifacts/e2e-result.txt
      - name: 화면 GIF → 실행 결과 페이지
        if: always()
        env:
          RESULTS_BRANCH: hands-results
          RESULTS_TITLE: "🤖 Hermes Hands — 에이전트가 앱을 조작하는 화면"
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          sudo -E bash lab/redroid/publish-results.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hands-e2e
          path: lab/redroid/artifacts/
          if-no-files-found: ignore
      - name: 폰 설치용 APK 릴리스 (hands-latest)
        if: success() && github.ref == 'refs/heads/main'
        run: |
          gh release delete hands-latest -y --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create hands-latest hermes-hands.apk hermes-hands.apk.sha256 -R "$GITHUB_REPOSITORY" \
            --title "Hermes Hands (최신 테스트 통과 빌드)" --prerelease \
            --notes "가상 안드로이드 종단 테스트를 통과한 빌드입니다. 폰에서 hermes-hands.apk 를 받아 설치 → 앱 열기 → 접근성 켜기 → 토큰 복사 → Termux에서 phone-hands-pair. (커밋 ${GITHUB_SHA::7})"
